# Strict analysis configuration for the investing app.
# CI enforces: flutter analyze (0 issues) + dart format --set-exit-if-changed.
# When adding or changing rules, fix violations in the same commit — never
# disable rules wholesale to make the analyzer quiet.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # --- errors & safety ---
    - avoid_dynamic_calls # dynamic leaks must be parsed at the repo boundary
    - avoid_type_to_string
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - unawaited_futures
    - test_types_in_equals

    # --- style: declarations ---
    - always_declare_return_types
    - avoid_positional_boolean_parameters
    - avoid_returning_this
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_typing_uninitialized_variables
    - type_annotate_public_apis
    - use_setters_to_change_properties

    # --- style: constructs ---
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_function_declarations_over_variables
    - prefer_if_elements_to_conditional_expressions
    - prefer_single_quotes
    - unnecessary_lambdas
    - unnecessary_null_aware_assignments
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - unnecessary_string_interpolations

    # --- style: structure & ordering ---
    - cascade_invocations
    - directives_ordering
    - eol_at_end_of_file
    - leading_newlines_in_multiline_strings
    - only_throw_errors
    - sort_pub_dependencies
    - unnecessary_library_directive
    - use_is_even_rather_than_modulo
    - use_string_buffers
    - use_super_parameters
    - prefer_mixin
